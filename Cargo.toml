[package]
name = "media-creator-onboarding"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Async Rust service for media creator onboarding with email and SMS delivery"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
